<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pirata: free tools for students that run in your browser. Merge and compress PDFs, remove backgrounds, compress images, merge PDFs, make GIFs, format JSON and more. No sign-up, no uploads." />
    <meta name="theme-color" content="#f7f6f1" />
    <title>Pirata: free tools for students</title>
    <script>
      try { var t = localStorage.getItem('pirata-theme'); document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
